steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--pull", "--tag", "${_IMAGE_URI}", "."]
images:
  - "${_IMAGE_URI}"
options:
  machineType: E2_HIGHCPU_8
substitutions:
  _IMAGE_URI: us-central1-docker.pkg.dev/example/capability-cells/federated-capability-offer-discovery-cell:manual
